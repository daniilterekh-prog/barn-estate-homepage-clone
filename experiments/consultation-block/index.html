<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Оригинальный блок консультации BARNES</title>
    <link rel="stylesheet" href="../shared/styles.css?v=consultation-responsive-selected-wide-height-centered-20260925" />
    <style>
      body{background:#fff;margin:0}
      .consultation-preview-note{color:#666;font-size:16px;line-height:1.5;margin:0 auto;max-width:1280px;padding:32px clamp(20px,calc(-26.6667px + 6.59722vw),100px) 0}
      .catalog-consultation__mobile-expert,.catalog-consultation__mobile-header{display:none}
      @media(max-width:540px){
        .consultation-preview-note{font-size:15px;padding:24px calc(8.94118px + 1.96078vw) 0}
        .catalog-consultation__media{background:#262626;padding:24px calc(8.94118px + 1.96078vw) 30px}
        .catalog-consultation__image,.catalog-consultation__overlay{display:none}
        .catalog-consultation__mobile-expert{align-items:center;display:flex;gap:12px;margin-bottom:20px}
        .catalog-consultation__mobile-photo{background:#262626;border:1px solid #fff;border-radius:50%;height:68px;overflow:hidden;width:68px}
        .catalog-consultation__mobile-photo img{display:block;height:100%;object-fit:cover;object-position:50% 20%;transform:scale(1.15);transform-origin:50% 20%;width:100%}
        .catalog-consultation__mobile-role{color:#ffffff8c;font-size:11px;letter-spacing:.1em;line-height:1.2;margin:0 0 4px;text-transform:uppercase}
        .catalog-consultation__mobile-name{color:#fff;font-size:21px;font-weight:300;line-height:1.1;margin:0}
        .catalog-consultation__header{display:none}
        .catalog-consultation__mobile-header{display:block;margin-bottom:20px}
        .catalog-consultation__mobile-title{color:#fff;font-size:31px;font-weight:300;letter-spacing:-.05em;line-height:1.05;margin:0}
        .catalog-consultation__mobile-lead{color:#ffffffb3;font-size:15px;font-weight:300;line-height:1.4;margin:12px 0 0}
        .catalog-consultation__method{flex:0 0 calc(50% - 5px);justify-content:center}
      }
    </style>
  </head>
  <body>
    <p class="consultation-preview-note">Оригинальный блок консультации — отдельный файл для комментариев и дальнейших правок.</p>

    <section class="catalog-consultation" aria-label="Консультация эксперта">
      <div class="catalog-consultation__inner base-container">
        <div class="catalog-consultation__media">
          <img class="catalog-consultation__image" src="https://front.barnes.vsavr.ru/pictures/mock/contacts-man.png" alt="" width="1920" height="800" />
          <div class="catalog-consultation__overlay" aria-hidden="true"></div>
          <div class="catalog-consultation__grid">
            <div class="catalog-consultation__content">
              <div class="catalog-consultation__mobile-expert"><div class="catalog-consultation__mobile-photo"><img src="../../assets/expert-cutout.png" alt="Руслан Прусс" width="68" height="68" /></div><div><p class="catalog-consultation__mobile-role">Эксперт BARNES</p><p class="catalog-consultation__mobile-name">Руслан Прусс</p></div></div>
              <div class="catalog-consultation__mobile-header"><h1 class="catalog-consultation__mobile-title">Эксперты BARNES подскажут</h1><p class="catalog-consultation__mobile-lead">Эксперты BARNES подскажут и помогут сориентироваться в городском рынке недвижимости.</p></div>
              <div class="catalog-consultation__header">
                <p class="catalog-consultation__subtitle">Эксперты BARNES подскажут</p>
              </div>
              <div class="catalog-consultation__methods" role="tablist" aria-label="Способ связи">
                <button class="catalog-consultation__method" type="button" role="tab" aria-selected="false">
                  <svg class="catalog-consultation__method-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h3l2 5-2 1.4a12.5 12.5 0 0 0 5.6 5.6L15 14l5 2v3c0 1.1-.9 2-2 2C10.3 21 3 13.7 3 5c0-1.1.9-2 2-2Z" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" /></svg>
                  <span>Звонок</span>
                </button>
                <button class="catalog-consultation__method" type="button" role="tab" aria-selected="false">
                  <svg class="catalog-consultation__method-icon catalog-consultation__method-icon--max" viewBox="0 0 42 42" aria-hidden="true"><path d="M21.47 41.88c-4.11 0-6.02-.6-9.34-3-2.1 2.7-8.75 4.81-9.04 1.2 0-2.71-.6-5-1.28-7.5C1 29.5.08 26.07.08 21.1.08 9.23 9.82.3 21.36.3c11.55 0 20.6 9.37 20.6 20.91a20.6 20.6 0 0 1-20.49 20.67m.17-31.32c-5.62-.29-10 3.6-10.97 9.7-.8 5.05.62 11.2 1.83 11.52.58.14 2.04-1.04 2.95-1.95a10.4 10.4 0 0 0 5.08 1.81 10.7 10.7 0 0 0 11.19-9.97 10.7 10.7 0 0 0-10.08-11.1Z" fill="currentColor" /></svg>
                  <span>MAX</span>
                </button>
                <button class="catalog-consultation__method catalog-consultation__method--active" type="button" role="tab" aria-selected="true">
                  <svg class="catalog-consultation__method-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26C2.158 6.443 6.593 2.009 12.045 2.009c2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884Z" fill="currentColor" /></svg>
                  <span>Whatsapp</span>
                </button>
                <button class="catalog-consultation__method" type="button" role="tab" aria-selected="false">
                  <svg class="catalog-consultation__method-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635Z" fill="currentColor" /></svg>
                  <span>Telegram</span>
                </button>
              </div>
              <form class="catalog-consultation__form" novalidate>
                <div class="catalog-consultation__honeypot" aria-hidden="true"><input type="text" tabindex="-1" autocomplete="off" /></div>
                <label class="catalog-consultation__field"><input class="catalog-consultation__input" type="text" autocomplete="name" placeholder="Введите Ваше имя" /></label>
                <label class="catalog-consultation__field"><input class="catalog-consultation__input" type="text" inputmode="tel" autocomplete="tel" placeholder="Ваш номер телефона" /></label>
                <label class="catalog-consultation__field catalog-consultation__field--textarea"><textarea class="catalog-consultation__textarea" rows="2" placeholder="Оставьте свой комментарий"></textarea></label>
                <button class="ui-button ui-button--primary ui-button--large ui-button--full catalog-consultation__submit" type="submit" formnovalidate>Отправить заявку</button>
                <div class="catalog-consultation__consent-wrap"><label class="catalog-consultation__consent"><input class="catalog-consultation__consent-input" type="checkbox" /><span class="catalog-consultation__consent-box" aria-hidden="true"></span><span class="catalog-consultation__consent-text">Я даю согласие на <a class="catalog-consultation__consent-link" href="/legal_notices/yuridicheskie-uvedomleniya/" target="_blank">обработку персональных данных</a></span></label></div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script>
      const methods = document.querySelectorAll('.catalog-consultation__method');
      methods.forEach((button) => button.addEventListener('click', () => {
        methods.forEach((item) => {
          item.classList.remove('catalog-consultation__method--active');
          item.setAttribute('aria-selected', 'false');
        });
        button.classList.add('catalog-consultation__method--active');
        button.setAttribute('aria-selected', 'true');
      }));
      document.querySelector('.catalog-consultation__form').addEventListener('submit', (event) => event.preventDefault());
    </script>
  </body>
</html>
